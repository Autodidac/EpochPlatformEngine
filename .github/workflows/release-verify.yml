name: Verify EpochPlatformEngine Release

on:
  push:
    branches:
      - main
    paths:
      - "RELEASE_VERIFY_TRIGGER"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(gh release view v0.1.0 \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName,targetCommitish,isDraft,isPrerelease,assets)"
          content="$(printf '%s\n' "${result}" | base64 -w0)"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/RELEASE_VERIFY_RESULT" \
            -f message="Record release asset verification" \
            -f content="${content}" \
            -f branch="main"
