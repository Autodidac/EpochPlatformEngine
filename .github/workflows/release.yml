name: EpochPlatformEngine Release

on:
  workflow_dispatch:
    inputs:
      release_authorized:
        description: Publish a new accepted version tag after source, CI and native acceptance
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: epoch-platform-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    if: inputs.release_authorized && startsWith(github.ref, 'refs/tags/v')
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev

      - name: Configure
        run: >-
          cmake -S . -B out/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DEPOCH_PLATFORM_BUILD_STATIC=ON
          -DEPOCH_PLATFORM_BUILD_SHARED=ON
          -DEPOCH_PLATFORM_BUILD_EXAMPLES=ON
          -DEPOCH_PLATFORM_BUILD_TESTS=ON
          -DEPOCH_PLATFORM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build out/release --parallel

      - name: Test
        run: ctest --test-dir out/release --output-on-failure

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < RELEASE_VERSION)"
          name="EpochPlatformEngine-v${version}-linux-x64"
          dist="${GITHUB_WORKSPACE}/dist"
          root="${dist}/${name}"

          mkdir -p "${root}/bin" "${root}/sdk" "${root}/source"
          cmake --install out/release --prefix "${root}/sdk"

          cp out/release/EpochPlatformReleaseExampleStatic "${root}/bin/"
          cp out/release/EpochPlatformReleaseExampleShared "${root}/bin/"
          cp -a out/release/libEpochPlatformEngine.so* "${root}/bin/"
          cp examples/release_app.cpp "${root}/source/"
          cp README.md "${root}/"
          cp docs/release-example.md "${root}/RELEASE_EXAMPLE.md"
          cp docs/release-notes.md "${root}/RELEASE_NOTES.md"
          cp LICENSE "${root}/"

          cat > "${root}/run-static.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "${root}/bin/EpochPlatformReleaseExampleStatic" "$@"
          SCRIPT

          cat > "${root}/run-shared.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          exec "${root}/bin/EpochPlatformReleaseExampleShared" "$@"
          SCRIPT

          chmod +x "${root}/run-static.sh" "${root}/run-shared.sh"
          tar -C "${dist}" -czf "${dist}/${name}.tar.gz" "${name}"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: epoch-platform-release-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

  windows-x64:
    if: inputs.release_authorized && startsWith(github.ref, 'refs/tags/v')
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B out/release -A x64
          -DEPOCH_PLATFORM_BUILD_STATIC=ON
          -DEPOCH_PLATFORM_BUILD_SHARED=ON
          -DEPOCH_PLATFORM_BUILD_EXAMPLES=ON
          -DEPOCH_PLATFORM_BUILD_TESTS=ON
          -DEPOCH_PLATFORM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build out/release --config Release --parallel

      - name: Test
        run: ctest --test-dir out/release -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content RELEASE_VERSION -Raw).Trim()
          $name = "EpochPlatformEngine-v$version-windows-x64"
          $workspace = (Resolve-Path '.').Path
          $dist = Join-Path $workspace 'dist'
          $root = Join-Path $dist $name
          $bin = Join-Path $root 'bin'
          $sdk = Join-Path $root 'sdk'
          $source = Join-Path $root 'source'

          New-Item -ItemType Directory -Force -Path $bin, $sdk, $source | Out-Null
          cmake --install out/release --config Release --prefix $sdk

          Copy-Item out/release/Release/EpochPlatformReleaseExampleStatic.exe $bin
          Copy-Item out/release/Release/EpochPlatformReleaseExampleShared.exe $bin
          Copy-Item out/release/Release/EpochPlatformEngine.dll $bin
          Copy-Item examples/release_app.cpp $source
          Copy-Item README.md $root
          Copy-Item docs/release-example.md (Join-Path $root 'RELEASE_EXAMPLE.md')
          Copy-Item docs/release-notes.md (Join-Path $root 'RELEASE_NOTES.md')
          Copy-Item LICENSE $root

          @'
          @echo off
          pushd "%~dp0bin"
          EpochPlatformReleaseExampleStatic.exe %*
          set result=%errorlevel%
          popd
          exit /b %result%
          '@ | Set-Content -Encoding ascii (Join-Path $root 'run-static.cmd')

          @'
          @echo off
          pushd "%~dp0bin"
          EpochPlatformReleaseExampleShared.exe %*
          set result=%errorlevel%
          popd
          exit /b %result%
          '@ | Set-Content -Encoding ascii (Join-Path $root 'run-shared.cmd')

          Compress-Archive -Path "$root/*" -DestinationPath (Join-Path $dist "$name.zip") -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: epoch-platform-release-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: inputs.release_authorized && startsWith(github.ref, 'refs/tags/v')
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs:
      - linux-x64
      - windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: epoch-platform-release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n ' < RELEASE_VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_VERSION must contain three numeric components." >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "The pushed tag does not match RELEASE_VERSION." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # Only an explicit 404 proves absence. Authentication/network errors
          # must not be interpreted as permission to replace a release.
          if release_response="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null)"; then
            echo "Release ${RELEASE_TAG} already exists; published bytes are immutable." >&2
            exit 1
          fi
          if ! grep -Eq '^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$)' <<< "${release_response}"; then
            echo "Could not verify that the release is absent; publication refused." >&2
            exit 1
          fi

          target="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          remote_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          if [[ -n "${remote_tag}" ]]; then
            git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "${target}" ]]; then
              echo "The existing tag points to another commit; publication refused." >&2
              exit 1
            fi
          else
            if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              if [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "${target}" ]]; then
                echo "The local tag points to another commit; publication refused." >&2
                exit 1
              fi
            else
              git tag "${RELEASE_TAG}" "${target}"
            fi
            # A concurrent tag creation fails rather than moving that tag.
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Creation and initial assets are one command. Never edit an existing
          # release or upload replacement assets, including on a failed rerun.
          gh release create "${RELEASE_TAG}" dist/* --verify-tag \
            --target "${target}" \
            --title "EpochPlatformEngine ${RELEASE_TAG}" \
            --notes-file docs/release-notes.md
